# Flash-Next decode/prefill tuning (2026-09-24). Delete this file (and
# daemon-reload + restart) to return to the stock serve-script behavior.
# Details and measurements: /opt/d/flash-next-perf/FINDINGS.md
[Service]
# PLE table stays in swap; these only make its lookups cheaper.
#   prefetch: issue all swap-ins for a gather up front (process_madvise WILLNEED)
#   prefill hint: prefetch rows for the rest of a prompt as soon as it's admitted
#   np ids: NumPy n-gram id computation for decode-sized batches (bit-identical)
Environment=VLLM_PLE_PREFETCH=1
Environment=VLLM_PLE_PREFILL_HINT=1
Environment=VLLM_PLE_NP_IDS=1
# Online FP8 (weight-only, 128x128 blocks, Marlin) for the checkpoint's BF16 dense
# layers (the NVFP4 experts are untouched). ~+0.5% perplexity. Tiny layers and the
# MoE router stay BF16 (Marlin FP8 is slower than cuBLAS on them); so does the vision tower.
Environment=DENSE_QUANT=fp8_per_block_static
Environment="DENSE_QUANT_IGNORE=*mlp.gate,*shared_expert*,*indexer*,*block_inject*,*in_proj_a,*in_proj_b,*in_proj_ba,*visual*"
# Let the QSA fused qkv_proj take the online FP8 too (checkpoint excludes it from NVFP4).
Environment=VLLM_QSA_QKV_ONLINE_QUANT=1
# Greedy MTP drafting with an FP8 copy of lm_head over a 98K "hot-token" subset
# (ranked from the model's own chat output + code; 99.6% coverage). Drafts are
# verified by the target, so this only changes speed/acceptance, never output.
# Built by /opt/d/flash-next-perf (gen_chat_corpus.py, then the ranking snippet in FINDINGS.md).
# Remove the VOCAB line for a full-vocab FP8 draft head (e.g. for non-English-heavy use).
Environment=VLLM_DRAFT_HEAD_FP8=1
Environment=VLLM_DRAFT_VOCAB_FILE=/opt/d/flash-next-perf/draft_vocab_chat96k.npy
# Target lm_head: a full-vocab FP8 copy for decode-sized batches (M <= 64); prefill keeps BF16.
# Short-passage NLL test: +0.21% ppl vs a +0.13% noise floor, so ~+0.1%. About -0.5 ms/step.
Environment=VLLM_LM_HEAD_FP8=1
# Split-K Triton GEMM for BF16 layers with <=256 outputs at decode batch sizes.
Environment=VLLM_NARROW_GEMM=1
# Bigger prefill chunks (KV cache still ~220K tokens > 184K max context).
Environment=MAX_NUM_BATCHED_TOKENS=8192
# 4 MTP draft tokens (5 fails: QSA ring capacity). Best for chat, greedy and sampled.
Environment=SPEC_TOKENS=4
